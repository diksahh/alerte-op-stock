# ============================================================
#  Ce qu'on cherche : uniquement displays et tins, en FR et EN
# ============================================================
recherches:
  - nom: One Piece
    requete: "one piece"
    motif_set: '\bOP\s?[-_]?\s?0?(\d{1,2})\b'
    prefixe: OP
    min: 1
    max: 18
    types: [display, tin]
    langues: [fr, en]
    langue_inconnue: true
    exclure: [pokémon, pokemon, épée et bouclier, epee et bouclier, écarlate, ecarlate]

  - nom: One Piece Tins
    requete: "one piece tin"
    motif_set: '\bTS\s?[-_]?\s?0?(\d{1,2})\b'
    prefixe: TS
    min: 1
    max: 9
    types: [tin]
    langues: [fr, en]
    langue_inconnue: true
    exclure: [pokémon, pokemon, épée et bouclier, epee et bouclier, écarlate, ecarlate]

  - nom: One Piece Extra Boosters
    requete: "one piece"
    motif_set: '\bEB\s?[-_]?\s?0?(\d{1,2})\b'
    prefixe: EB
    min: 1
    max: 9
    types: [display]
    langues: [fr, en]
    langue_inconnue: true
    exclure: [pokémon, pokemon, épée et bouclier, epee et bouclier, écarlate, ecarlate]

  - nom: One Piece Premium Boosters
    requete: "one piece"
    motif_set: '\bPRB\s?[-_]?\s?0?(\d{1,2})\b'
    prefixe: PRB
    min: 1
    max: 9
    types: [display]
    langues: [fr, en]
    langue_inconnue: true
    exclure: [pokémon, pokemon, épée et bouclier, epee et bouclier, écarlate, ecarlate]

# ============================================================
#  Mots qui font ignorer un produit (accessoires, protections...)
#  Il suffit du début du mot : "acryl" écarte acrylique et acrylic
# ============================================================
mots_exclus:
  - protection
  - protector
  - protège
  - protege
  - acryl
  - magnetic
  - magnétique
  - plexi
  - vitrine
  - rangement
  - storage
  - étui
  - etui
  - présentoir
  - presentoir
  - coque
  - support
  - display vide
  - empty
  - deck box
  - deckbox
  - porte
  - peluche
  - poster


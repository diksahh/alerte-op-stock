# ============================================================
#  Ce qu'on cherche
#  (pour ajouter Pokémon plus tard, on ajoutera un 2e bloc ici)
# ============================================================
recherches:
  - nom: One Piece
    requete: "one piece"                         # mot-clé tapé dans la recherche des boutiques
    motif_set: '\bOP\s?[-_]?\s?0?(\d{1,2})\b'    # reconnaît OP-16, OP16, OP 16...
    prefixe: OP
    min: 1                                       # OP-01
    max: 18                                      # OP-18
    types: [display, booster, tin]
    langues: [fr, en]
    langue_inconnue: true                        # alerter aussi si la langue n'est pas écrite

# ============================================================
#  Boutiques surveillées
#  Une seule ligne "url" suffit : le script trouve tout seul
#  comment lire chaque site. "pages" = pages précises à lire.
# ============================================================
